name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get project source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Create debug keystore
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 5. Fix KSP version
      - name: Fix KSP version
        run: |
          echo "Current KSP version:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.2.10-2.0.2"/g' gradle/libs.versions.toml

          echo "KSP version after fix:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 7. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 8. Clean project
      - name: Clean
        run: ./gradlew clean

      # 9. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 10. Show generated APK
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk" -print

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-OS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
