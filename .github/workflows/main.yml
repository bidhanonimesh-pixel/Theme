name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Create debug keystore
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 5. Fix KSP version
      - name: Fix KSP version
        run: |
          echo "KSP before:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.2.10-2.0.2"/g' gradle/libs.versions.toml

          echo "KSP after:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 7. Check Gradle
      - name: Check Gradle
        run: |
          gradle --version
          echo "Project files:"
          ls -la

      # 8. Fix Gradle Property Flag
      - name: Disable Kotlin SourceSets Flag
        run: echo "android.disallowKotlinSourceSets=false" >> gradle.properties

      # 9. Clean
      - name: Clean
        run: gradle clean

      # 10. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 11. Find APK
      - name: Find APK
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-OS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
